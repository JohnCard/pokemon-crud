<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon api</title>
    <link rel="icon" href="img/pokeball.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">React challenges</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./pages/crud.html">User crud</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <header>
            <h1>Pokemon searcher</h1>
            <form id="pokemon-name-form">
                <div class="row">
                    <div class="col-3">
                        <label for="pokemon-name-input" class="form-label">Type a pokemon name</label>
                        <input id="pokemon-name-input" type="text" aria-label="pokemon-name-field" class="form-control">
                    </div>
                    <div class="col-3">
                        <button type="submit" class="btn btn-success">Sarch pokemon</button>
                    </div>
                </div>
            </form>
        </header>
        <main>
            <!-- Button trigger modal -->
            <!-- Modal(s) -->
            <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="updateModalLabel">Update trainer</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="trainer-form-update" class="mb-3">
                                <div class="row row-gap-4">
                                    <div class="col-12 col-md-6">
                                        <label for="trainer-id-update" class="form-label">Trainer id</label>
                                        <input type="number" id="trainer-id-update" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="trainer-name-update" class="form-label">Trainer name</label>
                                        <input type="text" id="trainer-name-update" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="trainer-username-update">Trainer username</label>
                                        <input class="form-control" type="text" id="trainer-username-update">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label" for="trainer-email-update">Trainer email</label>
                                        <input class="form-control" type="email" id="trainer-email-update">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">update</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="deleteModalLabel">Delete trainer</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="trainer-form-delete" class="mb-3">
                                <div class="row row-gap-4">
                                    <div class="col-12 col-md-6">
                                        <label for="trainer-id-delete" class="form-label">Trainer id</label>
                                        <input type="number" id="trainer-id-delete" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <button type="submit" class="btn btn-danger" data-bs-dismiss="modal">delete</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- pokemon -->
            <div class="row my-3">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card d-none" id="pokemon-header">
                        <img class="card-img-top">
                        <div class="card-header">
                            <h5 id="name" class="card-title"></h5>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card d-none" id="pokemon-body">
                        <div class="card-body">
                            <h3 id="movements-title"></h3>
                            <ol id="movements"></ol>
                            <h3 id="types-title"></h3>
                            <ol id="types"></ol>
                            <h3 id="abilities-title"></h3>
                            <ol id="abilities"></ol>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card d-none" id="pokemon-footer">
                        <div class="card-footer">
                            <p id="id" class="card-text"></p>
                            <p id="weight"></p>
                            <p id="height"></p>
                            <p id="order"></p>
                            <p id="base-experience"></p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- pokemon trainers -->
            <h2>Pokemon trainers</h2>
            <div class="row row-gap-3" id="users-container">
            </div>
            <!-- trainer form -->
            <form id="trainer-form" class="mb-3">
                <h2>Trainer form</h2>
                <div class="row row-gap-4">
                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="trainer-name" class="form-label">Trainer name</label>
                        <input type="text" id="trainer-name" class="form-control">
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label" for="trainer-username">Trainer username</label>
                        <input class="form-control" type="text" id="trainer-username">
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label" for="trainer-email">Trainer email</label>
                        <input class="form-control" type="email" id="trainer-email">
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label" for="favorite-pokemon">Favorite pokemon</label>
                        <input class="form-control" type="text" id="favorite-pokemon">
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <button type="submit" class="btn btn-primary">register</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
